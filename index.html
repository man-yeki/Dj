<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Requests • Africa Tanıtım Günü Samsun</title>
  <style>
    :root {
      --bg: #16110d;
      --surface: #221a14;
      --surface-hover: #2d221a;
      --border: #3d2e22;
      --gold: #f2a922;
      --terracotta: #d95d24;
      --green: #2e8555;
      --text: #fdf7ee;
      --muted: #b8a898;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, #2a1d14 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Subtle Kente-inspired top stripe */
    .accent-bar {
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        var(--terracotta) 0 28px,
        var(--gold) 28px 56px,
        var(--green) 56px 84px,
        #16110d 84px 92px
      );
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(242, 169, 34, 0.12);
      border: 1px solid rgba(242, 169, 34, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      min-width: 0;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--gold);
    }

    .btn {
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-search {
      background: var(--gold);
      color: #16110d;
    }

    .btn-link {
      background: var(--surface-hover);
      color: var(--gold);
      border: 1px solid var(--border);
    }

    .btn-link:hover {
      border-color: var(--gold);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .backup-section {
      margin-bottom: 20px;
    }

    .inline-error {
      color: #ffb899;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .inline-error.visible {
      display: block;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--terracotta), #e06d2b);
      color: #fff;
      font-size: 1.02rem;
      padding: 15px;
      margin-top: 14px;
    }

    .player-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
    }

    .player-card.active { display: block; }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .selected-meta {
      margin-top: 12px;
    }

    .selected-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold);
      font-weight: 700;
    }

    .selected-title {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.success {
      display: block;
      background: rgba(46, 133, 85, 0.2);
      border: 1px solid var(--green);
      color: #9be7bc;
    }

    .status-msg.error {
      display: block;
      background: rgba(217, 93, 36, 0.2);
      border: 1px solid var(--terracotta);
      color: #ffb899;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }

    .result-item:hover { background: var(--surface-hover); }
    .result-item.selected {
      border-color: var(--gold);
      background: var(--surface-hover);
    }

    .result-item img {
      width: 96px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .result-info { min-width: 0; }

    .result-title {
      font-size: 0.92rem;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-channel {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .helper-text {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>

  <main class="container">
    <header>
      <div class="badge">Africa Tanıtım Günü • Samsun</div>
      <h1>Drop Your Track Request</h1>
      <p>Search a song or paste a YouTube link, preview it in the player, and send it straight to the DJ booth.</p>
    </header>

    <!-- Option 1: YouTube Search -->
    <form class="input-group" id="searchForm">
      <input
        type="text"
        id="searchInput"
        placeholder="Search song name (e.g. Burna Boy - Last Last)..."
        required
      />
      <button type="submit" class="btn btn-search" id="searchBtn">Search</button>
    </form>

    <div class="divider">or paste a YouTube link directly</div>

    <!-- Option 2: Always-Active Direct Link Input -->
    <section class="backup-section">
      <form class="input-group" id="linkForm">
        <input
          type="url"
          id="linkInput"
          placeholder="https://www.youtube.com/watch?v=... or youtu.be/..."
          required
        />
        <button type="submit" class="btn btn-link" id="loadLinkBtn">Load Link</button>
      </form>
      <div class="inline-error" id="linkError"></div>
    </section>

    <!-- Preview & Submit Card -->
    <section class="player-card" id="playerCard">
      <div class="video-wrap">
        <iframe
          id="ytPlayer"
          title="YouTube preview player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="selected-meta">
        <div class="selected-label">Ready to Send</div>
        <div class="selected-title" id="selectedTitle"></div>
      </div>

      <button type="button" class="btn btn-submit" id="submitBtn">
        Send Song to DJ
      </button>

      <div class="status-msg" id="statusMsg"></div>
    </section>

    <!-- Search Results -->
    <div id="resultsHint" class="helper-text">Search above or paste a YouTube link to preview your track.</div>
    <section class="results-list" id="resultsList"></section>
  </main>

  <script>
    // =========================================================
    // 1. PASTE YOUR TWO KEYS HERE
    // =========================================================
    const YOUTUBE_API_KEY = "AIzaSyBAP8N8iYYGgwAWCNSjH9luXuRqkq3EUCE";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfcRgoG0ODpMmfWF3AgBHs6L3OcLBW6ze_hs48WzKbDsCPmy-o-aEiGWE3__JWO8Jy/exec";
    // =========================================================

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const linkForm = document.getElementById("linkForm");
    const linkInput = document.getElementById("linkInput");
    const linkError = document.getElementById("linkError");
    const resultsList = document.getElementById("resultsList");
    const resultsHint = document.getElementById("resultsHint");
    const playerCard = document.getElementById("playerCard");
    const ytPlayer = document.getElementById("ytPlayer");
    const selectedTitle = document.getElementById("selectedTitle");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    let currentSearchTerm = "";
    let selectedVideo = null;
    let lastSubmittedId = null;

    function decodeHtml(str) {
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = "status-msg " + type;
    }

    function clearStatus() {
      statusMsg.className = "status-msg";
      statusMsg.textContent = "";
    }

    function showLinkError(msg) {
      linkError.textContent = msg;
      linkError.classList.add("visible");
    }

    function clearLinkError() {
      linkError.textContent = "";
      linkError.classList.remove("visible");
    }

    // Extracts the 11-char YouTube ID from watch, youtu.be, shorts, music, or embed URLs
    function extractYouTubeId(rawUrl) {
      const trimmed = rawUrl.trim();
      const pattern = /(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = trimmed.match(pattern);
      return match ? match[1] : null;
    }

    // Fetches track title via YouTube's free oEmbed endpoint (uses 0 API quota)
    async function fetchTitleViaOEmbed(videoId) {
      try {
        const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;
        const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(cleanUrl)}&format=json`);
        if (!res.ok) throw new Error("oEmbed unavailable");
        const data = await res.json();
        return data.title || `Direct Link (${videoId})`;
      } catch {
        return `Direct Link (${videoId})`;
      }
    }

    // Handle Direct Link Form Submit & Auto-Load on Paste
    async function handleDirectLink(rawUrl) {
      clearLinkError();
      clearStatus();

      const videoId = extractYouTubeId(rawUrl);
      if (!videoId) {
        showLinkError("Please enter a valid YouTube link (youtube.com or youtu.be).");
        return;
      }

      document.querySelectorAll(".result-item").forEach((el) => el.classList.remove("selected"));
      currentSearchTerm = "Direct Link Paste";
      selectedVideo = { id: videoId, title: "Loading track title..." };

      selectedTitle.textContent = "Loading track title...";
      ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      playerCard.classList.add("active");

      submitBtn.disabled = true;
      submitBtn.textContent = "Loading info...";

      const resolvedTitle = await fetchTitleViaOEmbed(videoId);
      // Ensure user hasn't switched videos while fetching
      if (selectedVideo && selectedVideo.id === videoId) {
        selectedVideo.title = resolvedTitle;
        selectedTitle.textContent = resolvedTitle;
        submitBtn.disabled = (lastSubmittedId === videoId);
        submitBtn.textContent = (lastSubmittedId === videoId) ? "Already Sent" : "Send Song to DJ";
      }
    }

    linkForm.addEventListener("submit", (e) => {
      e.preventDefault();
      handleDirectLink(linkInput.value);
    });

    linkInput.addEventListener("paste", () => {
      setTimeout(() => {
        if (extractYouTubeId(linkInput.value)) {
          handleDirectLink(linkInput.value);
        }
      }, 50);
    });

    // Handle YouTube API Search
    searchForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      clearLinkError();
      clearStatus();

      if (YOUTUBE_API_KEY.startsWith("PASTE_")) {
        resultsHint.textContent = "Search API not configured yet — paste a YouTube link in the box above instead.";
        return;
      }

      currentSearchTerm = query;
      searchBtn.disabled = true;
      searchBtn.textContent = "Searching...";
      resultsHint.textContent = "Searching YouTube...";
      resultsList.innerHTML = "";

      try {
        const endpoint =
          "https://www.googleapis.com/youtube/v3/search" +
          "?part=snippet" +
          "&type=video" +
          "&videoEmbeddable=true" +
          "&maxResults=5" +
          "&q=" + encodeURIComponent(query) +
          "&key=" + encodeURIComponent(YOUTUBE_API_KEY);

        const res = await fetch(endpoint);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error?.message || "YouTube search failed.");
        }

        const items = data.items || [];
        if (items.length === 0) {
          resultsHint.textContent = "No embeddable videos found. Try another search or paste a YouTube link above.";
          return;
        }

        resultsHint.textContent = "Tap a track to preview it in the player:";
        renderResults(items);
      } catch (err) {
        resultsHint.textContent = "Search unavailable (" + err.message + "). You can still paste a YouTube link above!";
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "Search";
      }
    });

    function renderResults(items) {
      resultsList.innerHTML = "";

      items.forEach((item, index) => {
        const videoId = item.id.videoId;
        const title = decodeHtml(item.snippet.title);
        const channel = decodeHtml(item.snippet.channelTitle);
        const thumb = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url;

        const card = document.createElement("button");
        card.type = "button";
        card.className = "result-item";

        const img = document.createElement("img");
        img.src = thumb;
        img.alt = title;

        const info = document.createElement("div");
        info.className = "result-info";

        const titleEl = document.createElement("div");
        titleEl.className = "result-title";
        titleEl.textContent = title;

        const channelEl = document.createElement("div");
        channelEl.className = "result-channel";
        channelEl.textContent = channel;

        info.appendChild(titleEl);
        info.appendChild(channelEl);
        card.appendChild(img);
        card.appendChild(info);

        card.addEventListener("click", () => selectVideo({ id: videoId, title }, card));
        resultsList.appendChild(card);

        if (index === 0) {
          selectVideo({ id: videoId, title }, card, false);
        }
      });
    }

    function selectVideo(video, cardEl, autoplay = true) {
      selectedVideo = video;
      clearStatus();
      clearLinkError();

      document.querySelectorAll(".result-item").forEach((el) => el.classList.remove("selected"));
      cardEl.classList.add("selected");

      selectedTitle.textContent = video.title;
      ytPlayer.src = `https://www.youtube.com/embed/${video.id}${autoplay ? "?autoplay=1" : ""}`;
      playerCard.classList.add("active");

      submitBtn.disabled = (lastSubmittedId === video.id);
      submitBtn.textContent = (lastSubmittedId === video.id) ? "Already Sent" : "Send Song to DJ";
    }

    // Submit to Google Sheets (works identically for both search and pasted links)
    submitBtn.addEventListener("click", async () => {
      if (!selectedVideo) return;

      if (APPS_SCRIPT_URL.startsWith("PASTE_")) {
        showStatus("Configuration needed: paste your Google Apps Script Web App URL inside index.html.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      clearStatus();

      const payload = {
        searchTerm: currentSearchTerm,
        videoTitle: selectedVideo.title,
        youtubeUrl: `https://www.youtube.com/watch?v=${selectedVideo.id}`
      };

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.status === "success") {
          lastSubmittedId = selectedVideo.id;
          submitBtn.textContent = "Sent to DJ!";
          showStatus("Added to the Africa Tanıtım Günü playlist! Search or paste another link anytime.", "success");
        } else {
          throw new Error(result.message || "Submission failed.");
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Song to DJ";
        showStatus("Could not send request: " + err.message, "error");
      }
    });
  </script>
</body>
</html>
